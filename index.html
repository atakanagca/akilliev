<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Ev Otomasyonu</title>
    <style>
        /* Modern ve Karanlık Tema Tasarımı */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }
        .panel-container {
            background-color: #2a2a40;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            width: 360px;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; margin-bottom: 20px; letter-spacing: 1px; }
        
        .btn-satir {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 55px;
            width: 130px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-ac { background-color: #444; }
        .btn-kapat { background-color: #444; }
        
        .btn-yangin { background-color: #e74c3c; width: 100%; height: 60px; margin-top: 15px; font-size: 18px; }
        .btn-sondu { background-color: #3498db; width: 100%; height: 50px; margin-top: 10px; }

        /* YENİ: Sesli Komut Butonu Tasarımı */
        .btn-sesli { 
            background-color: #f39c12; 
            width: 100%; 
            height: 60px; 
            margin-bottom: 20px; 
            font-size: 18px; 
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
            animation: pulse 2s infinite;
        }
        
        /* Dinamik Renk Sınıfları */
        .aktif-yesil { background-color: #2ecc71 !important; box-shadow: 0 0 15px #2ecc71; }
        .alarm-kirmizi { background-color: #8b0000 !important; }
        .dinliyor { background-color: #e67e22 !important; animation: none; transform: scale(0.98); }

        /* Komut Sonucu Gösterme Yeri */
        #sesSonuc { margin-bottom: 20px; font-size: 14px; color: #aaa; min-height: 20px; }
    </style>
</head>
<body>

    <div class="panel-container">
        <h2>🏠 Akıllı Ev Yönetimi</h2>
        
        <button class="btn btn-sesli" id="btnMikrofon" onclick="sesDinle()">🎤 Sesli Komut Ver</button>
        <div id="sesSonuc"></div> <div class="btn-satir">
            <button class="btn btn-ac" id="btnSalonAc" onclick="komutYolla('SALON_AC')">Salonu Aç</button>
            <button class="btn btn-kapat" onclick="komutYolla('SALON_KAPAT')">Salonu Kapat</button>
        </div>
        
        <div class="btn-satir">
            <button class="btn btn-ac" id="btnOdaAc" onclick="komutYolla('ODA_AC')">Odayı Aç</button>
            <button class="btn btn-kapat" onclick="komutYolla('ODA_KAPAT')">Odayı Kapat</button>
        </div>

        <button class="btn btn-yangin" onclick="komutYolla('YANGIN')">🔥 YANGIN ALARMI</button>
        <button class="btn btn-sondu" onclick="komutYolla('SONDU')">💧 Alarmı Sustur</button>
    </div>

    <script>
        const KULLANICI_ADI = "Blecenreyy";
        const GIZLI_SIFRE = "aio_" + "vpoq027dtrSa64FzRSNZPzFOHjVQ"; 
        const ODA_ADI = "isik-kontrol";

        function komutYolla(komut) {
            fetch(`https://io.adafruit.com/api/v2/${KULLANICI_ADI}/feeds/${ODA_ADI}/data`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-AIO-Key': GIZLI_SIFRE
                },
                body: JSON.stringify({ value: komut })
            });
        }

        function durumuDinle() {
            fetch(`https://io.adafruit.com/api/v2/${KULLANICI_ADI}/feeds/${ODA_ADI}/data/last`, {
                method: 'GET',
                headers: { 'X-AIO-Key': GIZLI_SIFRE }
            })
            .then(response => response.json())
            .then(data => {
                let sonKomut = data.value;
                let arkaPlan = document.body;

                document.getElementById('btnSalonAc').className = (sonKomut === 'SALON_AC') ? 'btn btn-ac aktif-yesil' : 'btn btn-ac';
                document.getElementById('btnOdaAc').className = (sonKomut === 'ODA_AC') ? 'btn btn-ac aktif-yesil' : 'btn btn-ac';

                if(sonKomut === 'YANGIN') {
                    arkaPlan.className = 'alarm-kirmizi';
                } else {
                    arkaPlan.className = '';
                }
            });
        }

        setInterval(durumuDinle, 2000);
        durumuDinle();

        // ==========================================
        // YENİ BÖLÜM: BROWSER İÇİ YAPAY ZEKA DİNLEME
        // ==========================================
        const SesTanima = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SesTanima) {
            const tanima = new SesTanima();
            tanima.lang = 'tr-TR'; // Türkçe dinle

            function sesDinle() {
                tanima.start(); // Dinlemeyi başlat
                document.getElementById('btnMikrofon').innerText = "🎙️ Sizi Dinliyorum...";
                document.getElementById('btnMikrofon').className = "btn btn-sesli dinliyor";
                document.getElementById('sesSonuc').innerText = "Konuşun...";
            }

            tanima.onresult = function(event) {
                // Söylenen kelimeyi al ve küçük harfe çevir
                const soylenen = event.results[0][0].transcript.toLowerCase();
                document.getElementById('sesSonuc').innerText = `Anlaşılan: "${soylenen}"`;
                
                // Kelime analizi yapıp komutu gönder
                if (soylenen.includes("salon") && (soylenen.includes("aç") || soylenen.includes("yak"))) {
                    komutYolla('SALON_AC');
                } 
                else if (soylenen.includes("salon") && soylenen.includes("kapat")) {
                    komutYolla('SALON_KAPAT');
                }
                else if (soylenen.includes("oda") && (soylenen.includes("aç") || soylenen.includes("yak"))) {
                    komutYolla('ODA_AC');
                }
                else if (soylenen.includes("oda") && soylenen.includes("kapat")) {
                    komutYolla('ODA_KAPAT');
                }
                else if (soylenen.includes("yangın")) {
                    komutYolla('YANGIN');
                }
                else if (soylenen.includes("söndü") || soylenen.includes("sustur") || soylenen.includes("kapat")) {
                    // Yangın modunu susturmak için
                    komutYolla('SONDU');
                }
                else {
                    document.getElementById('sesSonuc').innerText = `Komut anlaşılamadı: "${soylenen}"`;
                }

                // Butonu eski haline getir
                document.getElementById('btnMikrofon').innerText = "🎤 Sesli Komut Ver";
                document.getElementById('btnMikrofon').className = "btn btn-sesli";
            };

            tanima.onerror = function() {
                document.getElementById('sesSonuc').innerText = "Mikrofon hatası veya ses anlaşılamadı.";
                document.getElementById('btnMikrofon').innerText = "🎤 Sesli Komut Ver";
                document.getElementById('btnMikrofon').className = "btn btn-sesli";
            };
        } else {
            // Safari'nin çok eski sürümleri gibi desteklenmeyen tarayıcılar için
            document.getElementById('btnMikrofon').style.display = "none";
            document.getElementById('sesSonuc').innerText = "Tarayıcınız sesli komut desteklemiyor.";
        }
    </script>
</body>
</html>
