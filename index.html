<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Ev Otomasyonu</title>
    <style>
        /* Modern ve Karanlık Tema Tasarımı */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }
        .panel-container {
            background-color: #2a2a40;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            width: 360px;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; margin-bottom: 30px; letter-spacing: 1px; }
        
        /* Butonları Yan Yana Kusursuz Hizalamak İçin Özel Satır */
        .btn-satir {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 55px;
            width: 130px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        .btn:active { transform: scale(0.95); }
        
        /* Buton Renkleri */
        .btn-ac { background-color: #444; }
        .btn-kapat { background-color: #444; }
        
        /* Yangın ve Sustur Butonları Tam Genişlikte */
        .btn-yangin { background-color: #e74c3c; width: 100%; height: 60px; margin-top: 20px; font-size: 18px; }
        .btn-sondu { background-color: #3498db; width: 100%; height: 50px; margin-top: 10px; }

        /* Dinamik Renk Sınıfları (Siri veya Panelden açıldığında yanacak) */
        .aktif-yesil { background-color: #2ecc71 !important; box-shadow: 0 0 15px #2ecc71; }
        .alarm-kirmizi { background-color: #8b0000 !important; }
    </style>
</head>
<body>

    <div class="panel-container">
        <h2>🏠 Akıllı Ev Yönetimi</h2>
        
        <div class="btn-satir">
            <button class="btn btn-ac" id="btnSalonAc" onclick="komutYolla('SALON_AC')">Salonu Aç</button>
            <button class="btn btn-kapat" onclick="komutYolla('SALON_KAPAT')">Salonu Kapat</button>
        </div>
        
        <div class="btn-satir">
            <button class="btn btn-ac" id="btnOdaAc" onclick="komutYolla('ODA_AC')">Odayı Aç</button>
            <button class="btn btn-kapat" onclick="komutYolla('ODA_KAPAT')">Odayı Kapat</button>
        </div>

        <button class="btn btn-yangin" onclick="komutYolla('YANGIN')">🔥 YANGIN ALARMI</button>
        <button class="btn btn-sondu" onclick="komutYolla('SONDU')">💧 Alarmı Sustur</button>
    </div>

    <script>
        // Senin Adafruit Bilgilerin
        const KULLANICI_ADI = "Blecenreyy";
        const GIZLI_SIFRE = "aio_caDw71avgWF6TZajSgZsu6oOeY0e";
        const ODA_ADI = "isik-kontrol";

        // Butona basıldığında Adafruit'e mesaj yollayan komut
        function komutYolla(komut) {
            fetch(`https://io.adafruit.com/api/v2/${KULLANICI_ADI}/feeds/${ODA_ADI}/data`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-AIO-Key': GIZLI_SIFRE
                },
                body: JSON.stringify({ value: komut })
            }).then(response => console.log("Giden: " + komut));
        }

        // Siri veya başka yerden gelen komutları 2 saniyede bir kontrol eden "Kulak"
        function durumuDinle() {
            fetch(`https://io.adafruit.com/api/v2/${KULLANICI_ADI}/feeds/${ODA_ADI}/data/last`, {
                method: 'GET',
                headers: { 'X-AIO-Key': GIZLI_SIFRE }
            })
            .then(response => response.json())
            .then(data => {
                let sonKomut = data.value;
                let arkaPlan = document.body;

                // Salon Butonu Rengi (Açıksa yeşil parlar)
                document.getElementById('btnSalonAc').className = (sonKomut === 'SALON_AC') ? 'btn btn-ac aktif-yesil' : 'btn btn-ac';
                
                // Oda Butonu Rengi (Açıksa yeşil parlar)
                document.getElementById('btnOdaAc').className = (sonKomut === 'ODA_AC') ? 'btn btn-ac aktif-yesil' : 'btn btn-ac';

                // Yangın Şovu (Ekran Kırmızıya Döner)
                if(sonKomut === 'YANGIN') {
                    arkaPlan.className = 'alarm-kirmizi';
                } else {
                    arkaPlan.className = '';
                }
            });
        }

        // Sistemi 2 saniyede bir Adafruit'e bakması için döngüye sokuyoruz
        setInterval(durumuDinle, 2000);
        durumuDinle(); // Sayfa açılır açılmaz ilk kontrolü yap
    </script>
</body>
</html>
